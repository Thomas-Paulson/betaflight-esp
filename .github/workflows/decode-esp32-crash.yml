name: Decode ESP32WROOM crash

on:
  workflow_dispatch:
    inputs:
      crash_address:
        description: "ESP32 crash address, e.g. 0x400d1065"
        required: true
        default: "0x400d1065"
        type: string

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialise submodules
        run: git submodule update --init --recursive

      - name: Build ESP32WROOM firmware
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            betaflight/betaflight-build:esp_idf-master \
            make TARGET=ESP32WROOM

      - name: Decode crash address
        env:
          CRASH_ADDRESS: ${{ inputs.crash_address }}
        run: |
          docker run --rm \
            -e CRASH_ADDRESS="$CRASH_ADDRESS" \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            betaflight/betaflight-build:esp_idf-master \
            sh -lc '
              set -eu

              ELF="$(find obj -type f -name "*.elf" -print -quit)"

              if [ -z "$ELF" ]; then
                echo "ERROR: No ELF file found."
                echo "Files produced by the build:"
                find obj -type f | head -200
                exit 1
              fi

              echo "======================================"
              echo "ESP32WROOM CRASH DECODER"
              echo "======================================"
              echo "ELF: $ELF"
              echo "Address: $CRASH_ADDRESS"
              echo

              echo "=== Decoded source location ==="
              xtensa-esp-elf-addr2line \
                -pfiaC -e "$ELF" "$CRASH_ADDRESS"

              echo
              echo "=== Detailed inline call information ==="
              xtensa-esp-elf-addr2line \
                -aipfC -e "$ELF" "$CRASH_ADDRESS"
            '

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: ESP32WROOM-crash-debug
          path: |
            obj/**/*.elf
            obj/**/*.map
            obj/**/*.bin
          if-no-files-found: warn
