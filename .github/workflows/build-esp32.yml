name: Build Betaflight ESP32WROOM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Betaflight
        uses: actions/checkout@v4

      - name: Initialise required submodules
        run: git submodule update --init --recursive

      - name: Build ESP32WROOM firmware
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            betaflight/betaflight-build:esp_idf-master \
            make TARGET=ESP32WROOM

      - name: Decode crash address
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            betaflight/betaflight-build:esp_idf-master \
            sh -lc '
              ELF=$(find obj -type f -name "*.elf" -print -quit)
              if [ -z "$ELF" ]; then
                echo "ERROR: No ELF file found"
                find obj -type f
                exit 1
              fi
              echo "Debugging: $ELF"
              xtensa-esp32-elf-addr2line -pfiaC -e "$ELF" 0x400d1065
            '

      - name: Upload firmware and debug files
        uses: actions/upload-artifact@v4
        with:
          name: Betaflight-ESP32WROOM-debug
          path: |
            obj/**/*.bin
            obj/**/*.elf
            obj/**/*.map
          if-no-files-found: error
